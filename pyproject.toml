[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechex"
version = "1.0.0"
description = "Local tissue exposure estimation for peripheral arterial disease repurposing candidates"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "MechEx authors" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "torch>=2.2",
    "PyYAML>=6.0",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5", "black>=24.4", "isort>=5.13", "mypy>=1.10"]

[project.scripts]
mechex-train = "mechex.console.train:main"
mechex-evaluate = "mechex.console.evaluate:main"
mechex-audit = "mechex.console.audit:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", "runs", "assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "TID"]
ignore = ["ANN401", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "E501"]
"configs/*" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["mechex"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["mechex"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/mechex"]
warn_unreachable = true
disallow_any_generics = true
plugins = []

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*"]
ignore_missing_imports = true
